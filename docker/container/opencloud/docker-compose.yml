services:
  opencloud:
    image: opencloudeu/opencloud:latest
    container_name: opencloud
    entrypoint: ['/bin/sh']
    command: ['-c', 'opencloud init || true; opencloud server']
    extra_hosts:
      - your-domain.com:host-gateway
    ports:
      - 9200:9200
    environment:
      - OC_INSECURE=false
      - PROXY_TLS=false
      - OC_URL=https://your-domain.com
      - IDM_ADMIN_PASSWORD=ThisisVerySecretDontOpenThisfileBecauseIMWachingYou
      - OC_SHARING_PUBLIC_SHARE_MUST_HAVE_PASSWORD=false
    volumes:
      - ./config:/etc/opencloud
      - ./data:/var/lib/opencloud
    restart: unless-stopped
